<!DOCTYPE html>
<html>
<head>
    <title>Tab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <table style="border-collapse: collapse; width: 100%; height: 100vh; table-layout: fixed;">
        <tr>
            <td style="background-color: #FFC0CB; color: white; width: 50%;">First cell</td>
            <td style="background-color: #A7C7E7; color: white; width: 50%;">Second cell</td>
        </tr>
    </table>
</body>
</html>
